# Render blueprint: spins up the API and the static client.
# After deploy: replace the two CHANGE-ME URLs with the real hostnames.
services:
  - type: web
    name: syncboard-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false # secret — Render will prompt you for the Atlas URI
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://CHANGE-ME-syncboard.onrender.com

  - type: web
    name: syncboard-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://CHANGE-ME-syncboard-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
