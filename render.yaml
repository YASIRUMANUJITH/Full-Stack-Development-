# Render blueprint: one `render.yaml` spins up the API and the static client.
# Deploy: Render dashboard → New → Blueprint → point at this repo.
# Afterwards set the two marked URLs to the real hostnames Render assigns.
services:
  - type: web
    name: syncboard-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false # secret — paste your Atlas connection string in the dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://CHANGE-ME-syncboard.onrender.com # the static site's URL (CORS)
      - key: PORT
        value: "4000"

   - type: web                  # was: type: static
    name: syncboard-client
    runtime: static            # new line — this is what makes it a static site
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://CHANGE-ME-syncboard-api.onrender.com
    routes:
      # SPA fallback: deep links like /boards/<id> must serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
